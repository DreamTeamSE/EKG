<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EKG Monitor - Dream Team Engineering</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" sizes="192x192" href="../assets/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="ekg-body">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a href="../" class="navbar-brand">
        <img src="../assets/dte-icon.png" alt="Dream Team Engineering" class="logo">
      </a>
      <button type="button" class="navbar-toggler" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <div class="navbar-nav">
          <a href="../" class="nav-link">Home</a>
          <a href="https://www.ufdreamteameng.org/about-us" class="nav-link">About Us</a>
          <a href="https://www.ufdreamteameng.org/sponsor-us" class="nav-link">Sponsor Us</a>
          <a href="https://www.ufdreamteameng.org/contact-us" class="nav-link">Contact Us</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Controls -->
  <div class="container serial-controls">
    <button type="button" class="btn btn-primary" id="btnOpen">
      <i class="bi bi-usb-symbol"></i> Open
    </button>
    <button type="button" class="btn btn-danger" id="btnClose" disabled>
      <i class="bi bi-x-octagon-fill"></i> Close
    </button>
    <button type="button" class="btn btn-outline-secondary" id="btnDemo">
      <i class="bi bi-play-circle"></i> Demo Mode
    </button>
  </div>

  <!-- Status banner -->
  <div class="container">
    <div class="status-banner" id="statusBanner"></div>
  </div>

  <!-- Plot -->
  <div id="plot" class="container"></div>

  <!-- Electrode placement guide -->
  <div class="container" style="margin-top: 30px; margin-bottom: 30px;">
    <div class="card">
      <div class="card-body">
        <h4 class="text-center mb-4">Electrode Placement</h4>
        <ul class="electrode-list">
          <li class="text-danger">&#x1F534;: Right Arm</li>
          <li class="text-warning">&#x1F7E1;: Leg</li>
          <li class="text-success">&#x1F7E2;: Left Arm</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="../js/serial.js"></script>
  <script src="../js/ekg-plot.js"></script>
  <script>
    // --- State ---
    let serial = null;
    let plot = null;
    let demoTimer = null;
    let demoRunning = false;

    const btnOpen = document.getElementById("btnOpen");
    const btnClose = document.getElementById("btnClose");
    const btnDemo = document.getElementById("btnDemo");
    const statusBanner = document.getElementById("statusBanner");

    // --- Initialize plot ---
    plot = new EkgPlot("plot");
    plot.init();

    // --- Status helpers ---
    function showStatus(message, type) {
      statusBanner.textContent = message;
      statusBanner.className = "status-banner " + type;
    }

    function hideStatus() {
      statusBanner.className = "status-banner";
      statusBanner.textContent = "";
    }

    function setConnectedUI(connected) {
      btnOpen.disabled = connected;
      btnClose.disabled = !connected;
      btnDemo.disabled = connected;
    }

    // --- Serial connection ---
    btnOpen.addEventListener("click", async () => {
      if (!SerialHandler.isSupported()) {
        alert("Web Serial API not supported. Please use Chrome or Edge.");
        return;
      }

      stopDemo();

      serial = new SerialHandler({
        onData: (value) => plot.addSample(value),
        onLeadsOff: () => showStatus("Leads disconnected — check electrode placement", "warning"),
        onLeadsOn: () => hideStatus(),
        onConnect: () => {
          setConnectedUI(true);
          showStatus("Connected — reading data", "connected");
        },
        onDisconnect: () => {
          setConnectedUI(false);
          hideStatus();
        },
      });

      try {
        await serial.open();
      } catch (err) {
        console.error("Failed to open serial port:", err);
        alert("Failed to open serial port: " + err.message);
        setConnectedUI(false);
      }
    });

    btnClose.addEventListener("click", async () => {
      if (serial) {
        await serial.close();
        serial = null;
      }
      plot.reset();
    });

    // --- Demo mode (test without hardware) ---
    function ekgSample(t) {
      const phase = ((t % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const p = 3 * Math.exp(-Math.pow(phase - 0.8, 2) / 0.02);
      const q = -4 * Math.exp(-Math.pow(phase - 1.4, 2) / 0.008);
      const r = 25 * Math.exp(-Math.pow(phase - 1.57, 2) / 0.005);
      const s = -6 * Math.exp(-Math.pow(phase - 1.75, 2) / 0.008);
      const tw = 5 * Math.exp(-Math.pow(phase - 2.5, 2) / 0.04);
      const noise = (Math.random() - 0.5) * 0.8;
      return p + q + r + s + tw + noise;
    }

    let demoSampleIndex = 0;

    function startDemo() {
      demoRunning = true;
      demoSampleIndex = 0;
      plot.reset();
      setConnectedUI(true);
      btnDemo.textContent = " Stop Demo";
      btnDemo.disabled = false;
      showStatus("Demo mode — showing simulated EKG data", "connected");

      demoTimer = setInterval(() => {
        plot.addSample(ekgSample(demoSampleIndex * 0.05));
        demoSampleIndex++;
      }, 1);
    }

    function stopDemo() {
      if (demoTimer) {
        clearInterval(demoTimer);
        demoTimer = null;
      }
      demoRunning = false;
      setConnectedUI(false);
      btnDemo.innerHTML = '<i class="bi bi-play-circle"></i> Demo Mode';
      hideStatus();
    }

    btnDemo.addEventListener("click", () => {
      if (demoRunning) {
        stopDemo();
        plot.reset();
      } else {
        startDemo();
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
